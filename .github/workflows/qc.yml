# QC: runs the end-to-end AppTest harness (tests/qc_test.py) against all four independent apps.
#
# Two matrix variants so BOTH dependency paths stay tested on every push / PR:
#   stand-in         requirements.txt only (what a plain install or a Streamlit Community Cloud
#                    deploy gets); the SAS check asserts the clear "install pyreadstat" message
#                    and the anomaly checks assert the labeled [SI] stand-in paths are recorded.
#   optional-extras  requirements.txt plus pyreadstat, scikit-learn, POT and scipy, which flips the
#                    SAS .sas7bdat, Isolation-Forest and Sinkhorn checks on.
#
# ECRF_HOSTED is deliberately NOT set anywhere in this workflow. The harness checks the local
# default first, then sets and removes ECRF_HOSTED inside its own process for the hosted-mode
# checks; a runner-level value would turn every app hosted and make the local checks meaningless,
# so a guard step fails the job if the runner ever has it set.
name: QC

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    name: qc (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stand-in
            extras: ""
          - variant: optional-extras
            extras: "pyreadstat scikit-learn POT scipy"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements.txt
        run: python -m pip install -r requirements.txt

      - name: Install optional extras
        if: matrix.extras != ''
        run: python -m pip install ${{ matrix.extras }}

      - name: Show resolved versions
        run: python -m pip freeze

      - name: Check ECRF_HOSTED is unset
        run: |
          if [ -n "${ECRF_HOSTED+x}" ]; then echo "::error::ECRF_HOSTED must not be set in CI"; exit 1; fi

      - name: Run QC harness
        run: python tests/qc_test.py
