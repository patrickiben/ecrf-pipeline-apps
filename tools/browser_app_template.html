<!doctype html>
<!-- RENDERED FILE: edit tools/browser_app_template.html and run `python tools/sync_browser_apps.py`.
     CI fails if this page differs from the template as rendered (`--check`). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} (in-browser demo)</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:,">
<link rel="preconnect" href="{{CDN}}" crossorigin>
<!-- stlite {{STLITE_VERSION}}, an exact pinned release. Subresource Integrity: the browser refuses the stylesheet,
     and (where import-map integrity is supported) the two core modules, if their content changes. -->
<link rel="stylesheet" href="{{STLITE_CSS}}" integrity="{{STLITE_CSS_SRI}}" crossorigin="anonymous">
<link rel="stylesheet" href="app.css">
<script type="importmap">{{IMPORTMAP}}</script>
</head>
<body>
<header class="bar">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="../">eCRF pipeline apps</a> <span aria-hidden="true">/</span> <span aria-current="page">{{TITLE}}</span></nav>
  <p class="privacy"><strong>Privacy:</strong> {{PRIVACY_NOTE}}</p>
</header>
<main id="stage">
  <div id="root"></div>
  <section id="boot" aria-labelledby="boot-notice">
    <div class="boot-inner">
      <p id="boot-notice" class="notice" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="boot-text">{{LOADING_NOTICE}}</span></p>
      <p id="boot-step" class="step">Loading the page code.</p>
      <p id="boot-error" class="error" role="alert" hidden></p>
      <noscript><p class="error">This app needs JavaScript to run in your browser. The screenshot below shows its results on the bundled synthetic data; you can also <a href="{{RUN_LOCALLY}}">run it locally</a>.</p></noscript>
      <figure class="preview">
        <img src="../img/{{IMG}}" width="1440" height="960" alt="{{ALT}}">
        <figcaption>Screenshot of this app's results on the bundled synthetic data. To use your own files, <a href="{{RUN_LOCALLY}}">run it locally</a>.</figcaption>
      </figure>
    </div>
  </section>
</main>
<script type="application/json" id="stlite-config">
{{CONFIG}}
</script>
<script type="module" src="launch.js"></script>
</body>
</html>
