[browser]
gatherUsageStats = false

# Colors that meet WCAG AA contrast (4.5:1 for text) where Streamlit's defaults do not; the apps still follow the
# system's light or dark setting. Light: the primary color (white text on the Execute button and on multiselect
# tags, a slider's value), captions (drawn at 60% opacity of the text color), and the warning, error and success
# text. Dark: the primary color, for white text on the Execute button and the tags. One gap remains in dark mode on
# a local run: Streamlit writes a slider's value in the primary color on the sidebar (3.2:1 here), and no single
# primary passes both that and white text. The in-browser pages close it in docs/app/app.css. They set the same
# theme in docs/app/launch.js (streamlitConfig); keep the two in step.
[theme.light]
primaryColor = "#0757BF"
textColor = "#101218"
yellowTextColor = "#7A5A00"
redTextColor = "#A3262A"
greenTextColor = "#11752F"

[theme.dark]
primaryColor = "#1F6FEB"
